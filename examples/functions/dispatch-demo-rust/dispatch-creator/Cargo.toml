[package]
name = "dispatch_creator"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flowcatalyst-fn = { path = "../../../../clients/fn-rust" }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
