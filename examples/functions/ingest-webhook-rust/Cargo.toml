[package]
name = "ingest_webhook"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flowcatalyst-fn = { path = "../../../clients/fn-rust" }
serde_json = { version = "1", features = ["preserve_order"] }
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
