[package]
name = "rusthost"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway benchmark hosts. v8bench: JS on V8 via deno_core (the Rust repo's
# spikes/fnhost-density/v8 baseline, same pinned version). wtbench: the compiled
# Rust guest on wasmtime.
[dependencies]
deno_core = "=0.412.0"
wasmtime = "=49.0.1"
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = false
codegen-units = 16
