[package]
name = "fcbench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"

[profile.release]
opt-level = "s"   # the SDK examples' setting; override with CARGO_PROFILE_RELEASE_OPT_LEVEL=3
lto = true
panic = "abort"
strip = true
codegen-units = 1
