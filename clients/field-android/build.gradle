// Standalone Android library (AAR). Consumed from Maven (GitHub Packages) or as a composite build.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "maven-publish"

group = "io.flowcatalyst"
version = file("VERSION").text.trim()

android {
    namespace "io.flowcatalyst.field"
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    api "com.squareup.okhttp3:okhttp:4.12.0"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    api "androidx.fragment:fragment:1.8.5" // FragmentActivity in the unlock signature
    implementation "androidx.biometric:biometric:1.1.0" // unlock only

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    // Real org.json on the JVM (android.jar's is a stub that returns defaults).
    testImplementation "org.json:json:20240303"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "io.flowcatalyst"
                artifactId = "field-android"
                version = project.version
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/flowcatalyst/flowcatalyst")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
