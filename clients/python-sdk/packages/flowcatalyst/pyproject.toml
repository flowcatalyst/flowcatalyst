[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowcatalyst"
version = "0.0.1"
description = "FlowCatalyst platform SDK for Python (async-first)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowcatalyst"]

[tool.mutmut]
paths_to_mutate = ["src/flowcatalyst/retry.py", "src/flowcatalyst/auth/tokens.py", "src/flowcatalyst/http.py"]
tests_dir = ["tests/"]
also_copy = ["tests/", "src/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
