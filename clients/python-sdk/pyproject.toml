# uv workspace root for the FlowCatalyst Python SDK. Holds the shared tool
# configuration; the two distributions live under packages/.
[project]
name = "flowcatalyst-python-sdk-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/flowcatalyst", "packages/flowcatalyst-fastapi"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "mypy>=1.11",
  "pyright>=1.1.380",
  "ruff>=0.6",
  "mutmut>=3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/flowcatalyst/src", "packages/flowcatalyst-fastapi/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"tools/**" = ["E501", "S603", "S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["packages/flowcatalyst/src", "packages/flowcatalyst/tests"]
plugins = ["pydantic.mypy"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["packages/flowcatalyst/src", "packages/flowcatalyst/tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/flowcatalyst/tests"]
addopts = "-ra"
