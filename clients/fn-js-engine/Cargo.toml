[package]
name = "fc-js-engine"
version = "0.1.0"
edition = "2021"
description = "The FlowCatalyst function runner's shared JavaScript engine: QuickJS behind ABI v1"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rquickjs = { version = "0.11", features = ["array-buffer"] }

# rquickjs-sys 0.11.0 as published on crates.io, with one line changed: QuickJS
# calls the interrupt handler every 100 poll points instead of every 10 000
# (JS_INTERRUPT_COUNTER_INIT in quickjs/quickjs.c, a plain #define that no
# feature or CFLAGS can override). The handler's clock read is the guest's
# only call into the host while JS runs, and Go cannot stop the goroutine for
# a garbage collection until that call comes: with 10 000, a loop of expensive
# iterations held the whole process for over a second
# (docs/function-runtime-deadlines.md, "The process pause").
# The copy keeps only what the crate's build reads (and the wasm32-wasip1
# bindings); check it with
#   diff -r ~/.cargo/registry/src/*/rquickjs-sys-0.11.0 vendor/rquickjs-sys
# which must show that one line and "Only in" lines for the files left out.
# On an rquickjs upgrade, re-vendor the new rquickjs-sys and re-apply the line.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
