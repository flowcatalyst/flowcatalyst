              type: "PrincipalID"
          - column: "iam_client_access_grants.client_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ClientID"
          - column: "iam_client_access_grants.principal_id"
