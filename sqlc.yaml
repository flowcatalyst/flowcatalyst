version: "2"
sql:
  - engine: postgresql
    # Schema is the embedded migration set — same SQL the binaries apply
    # at boot, so sqlc's view of the database matches what runs in prod.
    schema: internal/migrate/sql
    queries: internal/sqlc/queries
    gen:
      go:
        package: dbq
        out: internal/sqlc/dbq
        sql_package: pgx/v5
        # Generate the Querier interface so repos can inject a test
        # double if they want. The concrete *Queries type is also emitted.
        emit_interface: true
        emit_empty_slices: true
        # Single-arg signature (Querier method receivers), not the
        # db-argument variant. Keeps the call sites short.
        emit_methods_with_db_argument: false
        # Pointer for nullable columns so we can distinguish absent
        # from zero-value in the repository layer.
        emit_pointers_for_null_types: true
        emit_json_tags: false
        # db tags let repos scan with pgx.RowToStructByName (the
        # conventions §4.3 form) instead of hand-rolled Scan loops.
        emit_db_tags: true
        overrides:
          # TIMESTAMPTZ → time.Time directly (sqlc defaults to
          # pgtype.Timestamptz; for NOT NULL columns we don't want the
          # nullable wrapper).
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # JSONB stays as json.RawMessage so callers control
          # encoding/decoding. Specific aggregates that want []string or
          # struct shapes can add column-level overrides here. Both
          # the NOT NULL and nullable cases need explicit entries —
          # the global match doesn't generalise across nullability.
          - db_type: "jsonb"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - db_type: "jsonb"
            nullable: true
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          # Entity identifiers carry their own Go types (internal/ids), so a
          # principal id and a client id cannot be swapped between a query
          # result and a domain call.
          #
          # Every column is listed explicitly, never by wildcard: column
          # overrides ignore `nullable:` and take the first match, so the
          # pointer form of a nullable column has to be stated per table, and a
          # wildcard would silently strip the pointer from any nullable column
          # it was not told about (a NULL then fails to scan at runtime). An
          # unlisted column stays a plain string, which is the safe default: it
          # shows up as a compile error at the first typed use, not as a
          # runtime scan error. To type a new column, add it here, matching the
          # migration's nullability (ALTER TABLE ... ADD COLUMN included; the audit
          # of this list read CREATE TABLE and ADD COLUMN statements only).
          #
          # Left as string on purpose: client_id on the high-volume msg_* tables
          # (events, dispatch jobs, scheduled-job instances and their logs),
          # which is set from external SDK payloads and unchecked, so a type would
          # cost an allocation per item and vouch for nothing; oauth_clients.client_id and
          # iam_authorization_codes.client_id (the OAuth client_id, not a tenant
          # client), aud_logs.principal_id (whatever actor id the caller
          # supplied; also its client_id and application_id), and the *_service_account_* columns (legacy rows key the
          # account by the principal's own id).
          - column: "tnt_clients.id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ClientID"
          - column: "app_applications.id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ApplicationID"
          - column: "iam_principals.id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "PrincipalID"
          - column: "app_application_openapi_specs.application_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ApplicationID"
          - column: "app_client_configs.application_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ApplicationID"
          - column: "app_client_configs.client_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ClientID"
          - column: "app_docs.application_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ApplicationID"
          - column: "app_platform_configs.client_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ClientID"
              pointer: true
          - column: "fng_domains.client_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ClientID"
              pointer: true
          - column: "fng_functions.application_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "ApplicationID"
          - column: "fng_functions.client_id"
            go_type:
