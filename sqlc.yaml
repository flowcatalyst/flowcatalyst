version: "2"
sql:
  - engine: postgresql
    # Schema is the embedded migration set — same SQL the binaries apply
    # at boot, so sqlc's view of the database matches what runs in prod.
    schema: internal/migrate/sql
    queries: internal/sqlc/queries
    gen:
      go:
        package: dbq
        out: internal/sqlc/dbq
        sql_package: pgx/v5
        # Generate the Querier interface so repos can inject a test
        # double if they want. The concrete *Queries type is also emitted.
        emit_interface: true
        emit_empty_slices: true
        # Single-arg signature (Querier method receivers), not the
        # db-argument variant. Keeps the call sites short.
        emit_methods_with_db_argument: false
        # Pointer for nullable columns so we can distinguish absent
        # from zero-value in the repository layer.
        emit_pointers_for_null_types: true
        emit_json_tags: false
        # db tags let repos scan with pgx.RowToStructByName (the
        # conventions §4.3 form) instead of hand-rolled Scan loops.
        emit_db_tags: true
        overrides:
          # TIMESTAMPTZ → time.Time directly (sqlc defaults to
          # pgtype.Timestamptz; for NOT NULL columns we don't want the
          # nullable wrapper).
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # JSONB stays as json.RawMessage so callers control
          # encoding/decoding. Specific aggregates that want []string or
          # struct shapes can add column-level overrides here. Both
          # the NOT NULL and nullable cases need explicit entries —
          # the global match doesn't generalise across nullability.
          - db_type: "jsonb"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - db_type: "jsonb"
            nullable: true
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          # Entity identifiers carry their own Go types (internal/ids), so a
          # principal id and a client id cannot be swapped between a query
          # result and a domain call. A column named for an entity id maps to
          # that entity's type wherever it appears.
          #
          # Column overrides ignore `nullable:` and take the FIRST match, so the
          # pointer form of a nullable column has to be listed per table, ahead
          # of the wildcard. Adding a nullable principal_id column means adding
          # its table here; the giveaway is a NOT NULL-typed field where a
          # pointer belongs.
          # aud_logs.principal_id stays a string: the audit log records whatever
          # actor id the caller supplied, not only principals.
          - column: "aud_logs.principal_id"
            go_type:
              type: "string"
              pointer: true
          - column: "iam_login_attempts.principal_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "PrincipalID"
              pointer: true
          - column: "iam_principals.id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "PrincipalID"
          - column: "*.principal_id"
            go_type:
              import: "github.com/flowcatalyst/flowcatalyst-go/internal/ids"
              type: "PrincipalID"
