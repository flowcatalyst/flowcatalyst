name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything below is reproducible locally with `make ci` (same pinned tools,
# same order); the fast subset without Docker/Postgres is `make pre-push`.
# Tool versions are pinned in the Makefile (GOLANGCI_LINT_VERSION, SQLC_VERSION)
# and must be bumped together with `version:` in the lint job below.

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowcatalyst
          POSTGRES_PASSWORD: flowcatalyst
          POSTGRES_DB: flowcatalyst_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      # `make build` builds the embedded Vue SPA, which needs pnpm + node.
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify go.mod tidy (all modules)
        run: make tidy-verify

      - name: Verify templ output (internal/ui)
        run: make ui-verify

      - name: Build
        run: make build

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration
        env:
          POSTGRES_URL: postgres://flowcatalyst:flowcatalyst@localhost:5432/flowcatalyst_test?sslmode=disable

      - name: Custom UoW seal analyzer
        run: make analyze

      # Conformance checks `make ci` also runs: the committed OpenAPI lock and
      # sqlc output match the code, and the SPA's generated types match the lock.
      - name: sqlc output current (pinned sqlc)
        run: make sqlc-verify
      - name: OpenAPI lock matches the live spec
        run: make api-diff
      - name: SPA generated API types match the lock
        run: make frontend-types-verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      # frontend/embed.go has `//go:embed all:dist`. We don't build the SPA
      # for linting, but the embed needs >=1 file under frontend/dist or the
      # package fails to typecheck — which aborts golangci's package load and
      # masks every other finding. Drop in a placeholder so all packages load
      # and the real linters run. (frontend/dist is gitignored; this stub is
      # CI-only and never committed.)
      - name: Stub embedded SPA dir so the embed typechecks
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      # v7 installs golangci-lint v2 (matches the v2 .golangci.yml). Timeout
      # comes from .golangci.yml (run.timeout).
      #
      # install-mode goinstall: the prebuilt golangci-lint binaries are still
      # compiled with Go 1.26 and panic type-checking the Go 1.27 stdlib
      # ("file requires newer Go version go1.27"). Building it with the
      # workflow's own toolchain sidesteps that. Drop back to the default
      # binary mode once upstream ships a go1.27-built release.
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: `latest` let new linter releases break CI on their own
          # (v2.15.0 tightened exhaustive directives and added stringscut).
          # Bump deliberately, fixing findings in the same change.
          version: v2.15.0
          install-mode: goinstall
          # Same build tags as `make lint`: the *_pg_test.go helpers compile
          # only under `integration` and used to escape the linter.
          args: --build-tags integration

  parity-spec:
    runs-on: ubuntu-latest
    continue-on-error: true  # allowlist-driven until phase 3 completes
    steps:
      - uses: actions/checkout@v4
      - run: echo "parity spec diff job — wired up in Phase 3 with oasdiff"
