name: Release ingestor

# Fires on `ingestor/v*` (cut via `make release-ingestor BUMP=…`); workflow_dispatch
# with a tag (re)builds an existing tag.
#
# Builds the fat jar (ingestor-runtime-X.Y.Z-all.jar) and publishes a GitHub
# Release on this repository with the jar and a SHA256 sidecar (fcdev downloads the
# jar from there to run an ingestor locally), then builds the container image from
# ingestor/Dockerfile for linux/amd64 + linux/arm64 and pushes it to
# ghcr.io/flowcatalyst/ingestor:X.Y.Z and :latest (a pre-release tag pushes only its
# own version tag). The image only copies the platform-independent jar onto the
# multi-arch eclipse-temurin base, so no cross-compilation is involved.
#
# Needs the secret FRAMEWORK_PACKAGES_TOKEN (read:packages on flowcatalyst/framework;
# the framework is resolved from GitHub Packages). Publishing needs only GITHUB_TOKEN.
# After the FIRST push, set the ghcr.io/flowcatalyst/ingestor package visibility to
# public if anonymous pulls are wanted (docs/releasing.md). Independent of
# split-ingestor.yml (own gate, SPLIT_INGESTOR), which runs on the same tag.

on:
  push:
    tags:
      - 'ingestor/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. ingestor/v0.1.0'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build + publish ingestor
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag + version
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^ingestor/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' does not match ingestor/vX.Y.Z[-suffix]" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#ingestor/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAGS="ghcr.io/flowcatalyst/ingestor:${VERSION}"
          if [[ "$VERSION" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/flowcatalyst/ingestor:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Record the source revision
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ingestor/pom.xml
          server-id: github-framework
          server-username: GITHUB_ACTOR
          server-password: FRAMEWORK_PACKAGES_TOKEN

      # The ingestor's framework BOM pins io.flowcatalyst:flowcatalyst-sdk; versions before 0.0.30
      # were never published (a Java SDK release was only a tag here). Install that version from its tag
      # into the runner's local repository first, as ci.yml and the framework's publish workflow do.
      - name: Java SDK version the framework BOM pins
        id: javasdk
        run: |
          ingestor/mvnw -B -q -N -f ingestor/pom.xml help:effective-pom -Doutput="$RUNNER_TEMP/effective-pom.xml"
          v=$(tr -d '\n \t' < "$RUNNER_TEMP/effective-pom.xml" | grep -o '<artifactId>flowcatalyst-sdk</artifactId><version>[^<]*' | head -1 | sed 's/.*<version>//')
          if [ -z "$v" ]; then echo "::error::no flowcatalyst-sdk version in the ingestor's effective pom"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FRAMEWORK_PACKAGES_TOKEN: ${{ secrets.FRAMEWORK_PACKAGES_TOKEN }}
      - name: Check out the Java SDK at that version
        uses: actions/checkout@v4
        with:
          ref: java-sdk/v${{ steps.javasdk.outputs.version }}
          path: .java-sdk-pinned
          sparse-checkout: /clients/java-sdk/
          sparse-checkout-cone-mode: false
      - name: Install the pinned Java SDK into the local repository
        run: ingestor/mvnw -B -q -f .java-sdk-pinned/clients/java-sdk/pom.xml install -DskipTests

      - name: Build and test
        working-directory: ingestor
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FRAMEWORK_PACKAGES_TOKEN: ${{ secrets.FRAMEWORK_PACKAGES_TOKEN }}
        run: ./mvnw -B -Drevision=${{ steps.meta.outputs.version }} verify

      - name: Collect the jar and its checksum
        id: jar
        run: |
          mkdir -p dist
          cp ingestor/ingestor-runtime/target/ingestor-runtime-${{ steps.meta.outputs.version }}-all.jar dist/
          # The example extension, for trying the extensions directory.
          cp ingestor/ingestor-extensions/generator/target/ingestor-extension-generator-${{ steps.meta.outputs.version }}.jar dist/
          (cd dist && for f in *.jar; do sha256sum "$f" > "$f.sha256"; done)
          ls -l dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          NOTES="Ingestor runtime v${VERSION}. Run: \`java -jar ingestor-runtime-${VERSION}-all.jar\` (see ingestor/README.md). Verify: \`sha256sum -c ingestor-runtime-${VERSION}-all.jar.sha256\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "ingestor v${VERSION}" --notes "$NOTES"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ingestor
          file: ingestor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ingestor
            org.opencontainers.image.description=FlowCatalyst ingestor runtime
            org.opencontainers.image.source=https://github.com/flowcatalyst/flowcatalyst
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
            org.opencontainers.image.licenses=Apache-2.0
