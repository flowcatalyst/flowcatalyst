name: Split function Rust SDK

# READY BUT OFF. Fires on `fn-rust-sdk/v*` (cut via `make release-fn-rust-sdk
# BUMP=…`), but every job is guarded by the repository variable
# SPLIT_FN_SDKS == 'true' (Settings > Secrets and variables > Actions >
# Variables). Until the owner sets it, a tag push runs nothing.
#
# When on: test clients/fn-rust, split it out with splitsh-lite, force-push it
# to the standalone flowcatalyst/fn-rust-sdk repo (secret FN_RUST_SDK_TOKEN)
# and re-tag plain vX.Y.Z there (what `git = …, tag = …` consumers pin).
#
# The optional `publish` job pushes the `flowcatalyst-fn` crate to crates.io.
# It needs a SECOND variable (PUBLISH_FN_RUST_CRATE == 'true'), the
# CARGO_REGISTRY_TOKEN secret, and the crate metadata listed in
# docs/releasing.md (license, repository, readme, ...).

on:
  push:
    tags:
      - 'fn-rust-sdk/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create on target repo (e.g., v0.1.0). Leave empty to just sync main.'
        required: false

concurrency:
  group: split-fn-rust-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  split:
    if: vars.SPLIT_FN_SDKS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # fn-rust-sdk/v0.1.0 -> v0.1.0
          if [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="${REF_NAME#fn-rust-sdk/}"
          else
            VERSION="$INPUT_TAG"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check tag matches Cargo.toml
        if: env.VERSION != ''
        run: |
          PKG=$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' clients/fn-rust/Cargo.toml)
          if [[ "v$PKG" != "$VERSION" ]]; then
            echo "::error::tag $VERSION does not match clients/fn-rust/Cargo.toml version $PKG"
            exit 1
          fi

      - name: Test
        working-directory: clients/fn-rust
        run: cargo test --locked

      - name: Install splitsh-lite
        run: |
          curl -L https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz | tar xz
          chmod +x splitsh-lite
          sudo mv splitsh-lite /usr/local/bin/

      - name: Split and push
        env:
          TARGET_REPO: https://x-access-token:${{ secrets.FN_RUST_SDK_TOKEN }}@github.com/flowcatalyst/fn-rust-sdk.git
        run: |
          SHA=$(splitsh-lite --prefix=clients/fn-rust)
          echo "Split SHA: $SHA"

          git remote add sdk "$TARGET_REPO" || git remote set-url sdk "$TARGET_REPO"
          git push sdk "$SHA:refs/heads/main" --force

          if [[ -n "$VERSION" ]]; then
            git push sdk "$SHA:refs/tags/$VERSION" --force
            echo "Tagged and pushed: $VERSION"
          fi

          echo "Successfully pushed to flowcatalyst/fn-rust-sdk"

  publish:
    # Second, independent switch: crates.io publish stays off even when the split is on.
    if: vars.SPLIT_FN_SDKS == 'true' && vars.PUBLISH_FN_RUST_CRATE == 'true' && startsWith(github.ref, 'refs/tags/fn-rust-sdk/v')
    needs: split
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish to crates.io
        working-directory: clients/fn-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
