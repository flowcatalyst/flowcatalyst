name: Release field-js

# Fires on `field-js/v*` (cut via `make release-field-js BUMP=…`). Checks the tag against
# clients/field-js/VERSION and package.json, installs with the committed lockfile,
# runs the checks and the build, then publishes @flowcatalyst/field-js to npm.
# Needs the repository secret NPM_TOKEN (an npm token that can publish to the
# @flowcatalyst scope). A pre-release version (X.Y.Z-suffix) goes to the `next`
# dist-tag so it is not what `npm install` resolves by default.

on:
  push:
    tags:
      - 'field-js/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. field-js/v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Test + publish field-js
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag + version
        id: meta
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^field-js/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' does not match field-js/vX.Y.Z[-suffix]" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#field-js/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - name: Check VERSION and package.json match the tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          have="$(tr -d '[:space:]' < clients/field-js/VERSION)"
          pkg="$(node -p "require('./clients/field-js/package.json').version")"
          if [ "$have" != "$VERSION" ] || [ "$pkg" != "$VERSION" ]; then
            echo "clients/field-js: VERSION is $have, package.json is $pkg, tag says $VERSION" >&2
            exit 1
          fi

      - name: Check the npm token is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Repository secret NPM_TOKEN is not set; see docs/releasing.md (Field npm packages)." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Install
        working-directory: clients/field-js
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build
        working-directory: clients/field-js
        run: |
          pnpm run typecheck
          pnpm test
          pnpm run build

      - name: Publish to npm
        working-directory: clients/field-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag_flag=""
          if [[ "$VERSION" == *-* ]]; then tag_flag="--tag next"; fi
          # prepack runs the build again, so dist/lib cannot be missing.
          npm publish --access public $tag_flag
