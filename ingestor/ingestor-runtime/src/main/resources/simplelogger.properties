# The runtime's logging backend (slf4j-simple). Everything not named here keeps slf4j-simple's defaults
# (INFO and above, to standard error). A -Dorg.slf4j.simpleLogger.* system property overrides a line here.
#
# Camel components that log a failure themselves, on every failed poll or every failed exchange, with no
# hook to hand it over. Each failure below is reported by the runtime (the poll strategy's rollback, or the
# route's failed-exchange report), logged through its FailureLog (once in full, then a line a minute) and
# paced, so the component's own line is only a copy of it, written as often as the source fails
# (docs/ingestor-failure-pacing.md, R3/F12; docs/ingestor-gap-fixes.md, B2). Lines the runtime does not
# report elsewhere are not turned down. SourceLogLinesTest and AwsIngestTest prove the count.

# "Error while polling" (ERROR, with the stack trace) on every failed receive: the receive also fails the
# poll (one receive call a poll, CamelSourceEndpoints), which is reported. Its other lines cannot happen with
# the runtime's settings: the queue is never created (autoCreateQueue=false), message visibility is never
# extended (extendMessageVisibility=false), and the one attribute asked for (ApproximateReceiveCount) is known.
org.slf4j.simpleLogger.log.org.apache.camel.component.aws2.sqs.Sqs2Consumer=off

# "Exchange failed, so rolling back message status" (WARN, with the stack trace) for every object whose
# exchange failed: the route reports it. "Error getting S3Object": rethrown, so the poll fails and is reported.
org.slf4j.simpleLogger.log.org.apache.camel.component.aws2.s3.AWS2S3Consumer=error

# "Rollback file strategy" (WARN) for every sftp file whose exchange failed: the route reports it. "Done file
# could not be deleted": the runtime uses no done files.
org.slf4j.simpleLogger.log.org.apache.camel.component.file.GenericFileOnCompletion=error

# "The task SftpReconnect does not have more budget to continue running" (WARN) on every sftp poll that
# cannot connect: the poll then fails with "Cannot connect to ..." and is reported. In this runtime only the
# sftp (and ftp) connect uses Camel's BackgroundTask.
org.slf4j.simpleLogger.log.org.apache.camel.support.task.BackgroundTask=error
