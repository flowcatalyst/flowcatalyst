# Test fixture for the function runner: a raw ABI v1 guest (no SDK).
# The compiled module is committed at ../fixture.wasm so tests need no Rust
# toolchain; see ../fnfixture.go for the rebuild command.
[package]
name = "fixture-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
